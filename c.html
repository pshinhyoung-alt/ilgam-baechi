<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>작업 확인 - 일잡코리아</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Pretendard", system-ui, -apple-system, "Malgun Gothic", sans-serif; background: #f3f5fa; margin: 0; color: #18212f; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  header { background: linear-gradient(135deg, #2f5bea, #5b7cff); color: #fff; padding: 22px 18px 54px; }
  header .t { font-size: 13px; opacity: .85; font-weight: 600; }
  header .h { font-size: 20px; font-weight: 800; margin-top: 2px; letter-spacing: -.01em; }
  main { max-width: 480px; margin: -34px auto 0; padding: 0 14px 44px; }
  .card { background: #fff; border-radius: 18px; padding: 18px; margin-bottom: 14px; border: 1px solid #e5e9f1; box-shadow: 0 8px 24px rgba(16, 24, 40, .08); }
  h2 { font-size: 17px; margin: 0 0 10px; letter-spacing: -.01em; }
  dl { margin: 0; }
  dt { font-size: 12px; color: #667286; margin-top: 12px; font-weight: 600; }
  dd { margin: 2px 0 0; font-size: 16px; word-break: keep-all; font-weight: 500; }
  .big { width: 100%; padding: 16px; font-size: 18px; font-weight: 700; font-family: inherit; border: 0; border-radius: 14px; background: linear-gradient(135deg, #2f5bea, #5b7cff); color: #fff; cursor: pointer; margin-top: 12px; box-shadow: 0 8px 18px rgba(47, 91, 234, .3); }
  .big.sub { background: #fff; color: #18212f; border: 1px solid #d5dbe7; box-shadow: none; }
  .big.on { background: #2f5bea; color: #fff; border-color: #2f5bea; }
  .big:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row .big { margin-top: 0; }
  .msg { padding: 13px 14px; border-radius: 12px; font-size: 15px; margin-top: 12px; }
  .msg.err { background: #fdecec; color: #b3261e; }
  .msg.ok { background: #e6f6ec; color: #17683a; }
  .msg.info { background: #fff4dc; color: #85570a; }
  .status { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #e8eeff; color: #2f5bea; font-size: 13px; font-weight: 700; }
  textarea { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #d5dbe7; border-radius: 12px; font-family: inherit; margin-top: 8px; }
  a { color: #2f5bea; font-weight: 600; }
  .muted { color: #667286; font-size: 13px; margin-top: 4px; }
  .worker { border-top: 1px solid #eef1f6; padding: 14px 0 4px; }
  .worker:first-of-type { border-top: 0; }
  .wname { font-size: 17px; font-weight: 700; }
  .stars { display: flex; gap: 4px; margin-top: 8px; }
  .stars button { flex: 1; font-size: 26px; line-height: 1; padding: 8px 0; border: 1px solid #d5dbe7; background: #fff; border-radius: 10px; cursor: pointer; color: #c3cad8; font-family: inherit; }
  .stars button.on { color: #e5232b; border-color: #e5232b; background: #fdecec; }
  .star-on { color: #e5232b; }
  .star-off { color: #d5dbe7; }
</style>
</head>
<body>
<header><div class="t">일잡코리아</div><div class="h">작업 확인</div></header>
<main id="app"><div class="card">불러오는 중...</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="c.js"></script>
</body>
</html>
