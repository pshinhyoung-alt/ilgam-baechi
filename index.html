<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>일잡코리아 인력배치 - 로그인</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; background: #f4f6f8; margin: 0; display: grid; place-items: center; min-height: 100vh; }
  .box { background: #fff; padding: 28px 24px; border-radius: 12px; width: min(360px, 90vw); box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: block; font-size: 14px; margin: 14px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 11px; font-size: 16px; border: 1px solid #c9d0d8; border-radius: 8px; }
  button { width: 100%; margin-top: 20px; padding: 12px; font-size: 16px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { color: #c62828; font-size: 14px; margin-top: 14px; min-height: 18px; }
</style>
</head>
<body>
<form class="box" id="form">
  <h1>일잡코리아 인력배치 로그인</h1>
  <label for="email">이메일</label>
  <input id="email" type="email" autocomplete="username" required>
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button id="btn" type="submit">로그인</button>
  <div class="msg" id="msg"></div>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  const cfg = window.APP_CONFIG;

  if (cfg.SUPABASE_URL.startsWith("여기에")) {
    msg.textContent = "config.js 에 Supabase 주소와 키를 먼저 넣어 주세요.";
    btn.disabled = true;
  } else {
    const db = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);

    db.auth.getSession().then(({ data }) => {
      if (data.session) location.replace("admin.html");
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.textContent = "";
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("pw").value,
      });
      if (error) {
        msg.textContent = "이메일 또는 비밀번호가 맞지 않습니다.";
        btn.disabled = false;
        return;
      }
      location.replace("admin.html");
    });
  }
</script>
</body>
</html>
