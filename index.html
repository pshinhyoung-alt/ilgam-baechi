<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/app-apple-180.png">
<meta name="theme-color" content="#2f5bea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인력배치">
<script src="install.js"></script>
<title>일잡코리아 인력배치 - 로그인</title>
<link rel="stylesheet" href="common.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 20px;
         background: radial-gradient(900px 500px at 15% -10%, #dfe7ff 0%, rgba(223,231,255,0) 60%),
                     radial-gradient(800px 500px at 100% 110%, #e6ecff 0%, rgba(230,236,255,0) 60%), var(--bg); }
  .box { background: #fff; padding: 36px 32px 30px; border-radius: 22px; width: min(400px, 100%);
         border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(30, 50, 120, .14); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .logo { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
          background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; font-size: 22px; font-weight: 800;
          box-shadow: 0 8px 18px rgba(47, 91, 234, .35); }
  h1 { font-size: 21px; margin: 0; font-weight: 800; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #3b475c; margin: 16px 0 6px; }
  input { width: 100%; padding: 12px 14px; font-size: 16px; }
  .box button { width: 100%; margin-top: 24px; padding: 13px; font-size: 16px; }
  .msg { margin-top: 14px; min-height: 18px; }
  .ok { color: #137a3d; font-size: 14px; }
  .links { margin-top: 16px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .links a { color: var(--brand); }
</style>
</head>
<body>
<form class="box" id="form">
  <div class="brand"><div class="logo">일</div><h1>일잡코리아</h1></div>
  <p class="sub">인력 배치·출근 관리 · 직원 로그인</p>
  <label for="email">이메일</label>
  <input id="email" type="email" autocomplete="username" required>
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button id="btn" type="submit" class="primary">로그인</button>
  <div class="msg" id="msg"></div>
  <div class="links"><a href="#" id="forgot">비밀번호를 잊으셨나요?</a></div>
</form>

<form class="box" id="resetForm" hidden>
  <div class="brand"><div class="logo">일</div><h1>비밀번호 찾기</h1></div>
  <p class="sub">가입한 이메일을 입력하면 비밀번호를 다시 정하는 링크를 보내 드립니다.</p>
  <label for="rEmail">이메일</label>
  <input id="rEmail" type="email" autocomplete="username" required>
  <button id="rBtn" type="submit" class="primary">재설정 메일 보내기</button>
  <div class="msg" id="rMsg"></div>
  <div class="links"><a href="#" id="backLogin">← 로그인으로 돌아가기</a></div>
</form>

<form class="box" id="newPwForm" hidden>
  <div class="brand"><div class="logo">일</div><h1>새 비밀번호 정하기</h1></div>
  <p class="sub">앞으로 사용할 비밀번호를 입력해 주세요. (8자 이상)</p>
  <label for="nPw">새 비밀번호</label>
  <input id="nPw" type="password" autocomplete="new-password" minlength="8" required>
  <label for="nPw2">새 비밀번호 확인</label>
  <input id="nPw2" type="password" autocomplete="new-password" minlength="8" required>
  <button id="nBtn" type="submit" class="primary">비밀번호 바꾸기</button>
  <div class="msg" id="nMsg"></div>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  const cfg = window.APP_CONFIG;

  if (cfg.SUPABASE_URL.startsWith("여기에")) {
    msg.textContent = "config.js 에 Supabase 주소와 키를 먼저 넣어 주세요.";
    btn.disabled = true;
  } else {
    // 비밀번호 재설정 메일의 링크로 들어왔는지 (주소 뒤의 # 부분)는 로그인 도구가 지우기 전에 먼저 읽어 둠
    const startHash = location.hash || "";
    const fromResetLink = /type=recovery/.test(startHash);
    const linkExpired = /error_code=|error=access_denied/.test(startHash);
    const db = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);
    const showForm = (id) => ["form", "resetForm", "newPwForm"].forEach((f) => { $(f).hidden = f !== id; });

    db.auth.onAuthStateChange((event) => { if (event === "PASSWORD_RECOVERY") showForm("newPwForm"); });

    if (fromResetLink) {
      showForm("newPwForm");
    } else if (linkExpired) {
      history.replaceState(null, "", location.pathname);
      showForm("resetForm");
      $("rMsg").textContent = "링크가 만료되었거나 이미 사용되었습니다. 아래에서 다시 요청해 주세요.";
    } else {
      db.auth.getSession().then(({ data }) => {
        if (data.session) location.replace("admin.html");
      });
    }

    // 비밀번호 찾기: 이메일로 재설정 링크 보내기
    $("forgot").addEventListener("click", (e) => { e.preventDefault(); $("rEmail").value = $("email").value; $("rMsg").textContent = ""; showForm("resetForm"); });
    $("backLogin").addEventListener("click", (e) => { e.preventDefault(); showForm("form"); });
    $("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const rMsg = $("rMsg");
      $("rBtn").disabled = true;
      rMsg.className = "msg";
      rMsg.textContent = "";
      const redirectTo = location.origin + location.pathname.replace(/[^/]*$/, "") + "index.html";
      const { error } = await db.auth.resetPasswordForEmail($("rEmail").value.trim(), { redirectTo });
      $("rBtn").disabled = false;
      if (error) {
        rMsg.textContent = "메일을 보내지 못했습니다. 잠시(몇 분) 뒤에 다시 시도해 주세요.";
        return;
      }
      rMsg.className = "msg ok";
      rMsg.textContent = "재설정 메일을 보냈습니다. 받은편지함(스팸함도)을 확인해 주세요. 몇 분이 지나도 오지 않으면 등록한 이메일이 맞는지 확인하세요.";
    });

    // 새 비밀번호 저장 (메일의 링크를 누르고 들어온 뒤)
    $("newPwForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nMsg = $("nMsg");
      nMsg.textContent = "";
      const pw = $("nPw").value;
      if (pw.length < 8) { nMsg.textContent = "비밀번호는 8자 이상으로 정해 주세요."; return; }
      if (pw !== $("nPw2").value) { nMsg.textContent = "두 비밀번호가 서로 다릅니다."; return; }
      $("nBtn").disabled = true;
      const { error } = await db.auth.updateUser({ password: pw });
      if (error) {
        nMsg.textContent = /different from the old/i.test(error.message)
          ? "이전과 다른 비밀번호를 입력해 주세요."
          : "비밀번호를 바꾸지 못했습니다. 메일의 링크를 다시 눌러 주세요. (링크는 한 번만, 일정 시간 안에만 쓸 수 있습니다)";
        $("nBtn").disabled = false;
        return;
      }
      history.replaceState(null, "", location.pathname);
      location.replace("admin.html");
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.textContent = "";
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("pw").value,
      });
      if (error) {
        msg.textContent = "이메일 또는 비밀번호가 맞지 않습니다.";
        btn.disabled = false;
        return;
      }
      location.replace("admin.html");
    });
  }
</script>
</body>
</html>
