<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>일잡코리아 인력배치 - 로그인</title>
<link rel="stylesheet" href="common.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 20px;
         background: radial-gradient(900px 500px at 15% -10%, #dfe7ff 0%, rgba(223,231,255,0) 60%),
                     radial-gradient(800px 500px at 100% 110%, #e6ecff 0%, rgba(230,236,255,0) 60%), var(--bg); }
  .box { background: #fff; padding: 36px 32px 30px; border-radius: 22px; width: min(400px, 100%);
         border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(30, 50, 120, .14); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .logo { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
          background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; font-size: 22px; font-weight: 800;
          box-shadow: 0 8px 18px rgba(47, 91, 234, .35); }
  h1 { font-size: 21px; margin: 0; font-weight: 800; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #3b475c; margin: 16px 0 6px; }
  input { width: 100%; padding: 12px 14px; font-size: 16px; }
  .box button { width: 100%; margin-top: 24px; padding: 13px; font-size: 16px; }
  .msg { margin-top: 14px; min-height: 18px; }
</style>
</head>
<body>
<form class="box" id="form">
  <div class="brand"><div class="logo">일</div><h1>일잡코리아</h1></div>
  <p class="sub">인력 배치·출근 관리 · 직원 로그인</p>
  <label for="email">이메일</label>
  <input id="email" type="email" autocomplete="username" required>
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button id="btn" type="submit" class="primary">로그인</button>
  <div class="msg" id="msg"></div>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  const cfg = window.APP_CONFIG;

  if (cfg.SUPABASE_URL.startsWith("여기에")) {
    msg.textContent = "config.js 에 Supabase 주소와 키를 먼저 넣어 주세요.";
    btn.disabled = true;
  } else {
    const db = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);

    db.auth.getSession().then(({ data }) => {
      if (data.session) location.replace("admin.html");
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.textContent = "";
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("pw").value,
      });
      if (error) {
        msg.textContent = "이메일 또는 비밀번호가 맞지 않습니다.";
        btn.disabled = false;
        return;
      }
      location.replace("admin.html");
    });
  }
</script>
</body>
</html>
