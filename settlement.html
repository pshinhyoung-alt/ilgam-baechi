<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>일잡코리아 인력배치 - 정산</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<header class="top"><h1>정산</h1><nav id="nav"></nav></header>
<main>
  <div class="card noprint">
    <div class="toolbar" style="margin-bottom:8px">
      <select id="unit">
        <option value="day">일별</option>
        <option value="week">주별</option>
        <option value="quarter">분기별</option>
        <option value="year">연별</option>
      </select>
      <input type="date" id="from"> <span style="align-self:center">~</span> <input type="date" id="to">
      <select id="branchSel" hidden></select>
      <select id="workerSel" title="구직자 개인별 정산"><option value="">전체 구직자</option></select>
    </div>
    <div class="acts" style="margin-bottom:8px">
      <button type="button" data-p="today">오늘</button>
      <button type="button" data-p="week">이번 주</button>
      <button type="button" data-p="month">이번 달</button>
      <button type="button" data-p="lastmonth">지난 달</button>
      <button type="button" data-p="quarter">이번 분기</button>
      <button type="button" data-p="year">올해</button>
    </div>
    <label style="display:flex;gap:6px;align-items:center;font-size:14px">
      <input type="checkbox" id="incOut"> 퇴근만 하고 작업 완료 보고를 하지 않은 건도 포함
    </label>
    <div class="acts" style="margin-top:10px;align-items:center">
      <button class="primary" id="run">조회</button>
      <button id="xlsx" disabled>엑셀 내려받기</button>
      <button id="print" disabled>인쇄 / PDF</button>
      <span class="muted" id="status"></span>
    </div>
    <div class="msg" id="err" style="margin-top:8px"></div>
  </div>

  <div class="card" id="totalCard" hidden>
    <h2 style="font-size:16px;margin:0 0 8px" id="totalTitle">조회 기간 합계</h2>
    <div id="totals"></div>
  </div>

  <div class="card" id="workerCard" hidden>
    <h2 style="font-size:16px;margin:0 0 4px">구직자 개인별 정산</h2>
    <div class="muted noprint" style="margin-bottom:6px">조회 기간 전체를 구직자별로 합한 금액입니다. [개인 정산서]를 누르면 그 구직자 한 명의 내역만 보이고, 인쇄·PDF·엑셀도 그 사람 것만 나옵니다.</div>
    <div class="scroll"><table id="workerTable" class="has-act"></table></div>
  </div>

  <div class="card" id="sumCard" hidden>
    <h2 style="font-size:16px;margin:0 0 8px" id="sumTitle">기간별 요약</h2>
    <div class="scroll"><table id="sumTable"></table></div>
  </div>

  <div class="card" id="payCard" hidden>
    <h2 style="font-size:16px;margin:0 0 4px">구직자 지급 목록</h2>
    <div class="muted" style="margin-bottom:6px">입금할 금액입니다. 계좌번호는 화면에 표시하지 않고 엑셀 파일에만 들어갑니다.</div>
    <div class="scroll"><table id="payTable"></table></div>
  </div>

  <div class="card" id="billCard" hidden>
    <h2 style="font-size:16px;margin:0 0 4px">의뢰인 청구 목록</h2>
    <div class="muted" style="margin-bottom:6px">청구 금액을 제시 일당 기준으로 할지 확정 단가 기준으로 할지는 두 합계를 보고 정해 주세요.</div>
    <div class="scroll"><table id="billTable"></table></div>
  </div>

  <div class="card" id="branchCard" hidden>
    <h2 style="font-size:16px;margin:0 0 8px">지점별 요약</h2>
    <div class="scroll"><table id="branchTable"></table></div>
  </div>

  <div class="card" id="detailCard" hidden>
    <h2 style="font-size:16px;margin:0 0 4px">상세 내역</h2>
    <div class="muted" style="margin-bottom:6px" id="detailNote"></div>
    <div class="scroll"><table id="detailTable"></table></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="settlement.js"></script>
</body>
</html>
