<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>일감 확인 - 일잡코리아</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Malgun Gothic", sans-serif; background: #f4f6f8; margin: 0; color: #1c2430; }
  header { background: #1f6feb; color: #fff; padding: 14px 16px; font-size: 17px; font-weight: 600; }
  main { max-width: 480px; margin: 0 auto; padding: 14px 16px 40px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
  h2 { font-size: 16px; margin: 0 0 10px; }
  dl { margin: 0; }
  dt { font-size: 13px; color: #667; margin-top: 10px; }
  dd { margin: 2px 0 0; font-size: 16px; word-break: keep-all; }
  .big { width: 100%; padding: 16px; font-size: 18px; border: 0; border-radius: 12px; background: #1f6feb; color: #fff; cursor: pointer; margin-top: 10px; }
  .big.sub { background: #fff; color: #1c2430; border: 1px solid #c9d0d8; }
  .big:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row .big { margin-top: 0; }
  .msg { padding: 12px; border-radius: 10px; font-size: 15px; margin-top: 12px; }
  .msg.err { background: #fdecec; color: #b3261e; }
  .msg.ok { background: #e7f6ec; color: #1b6e3a; }
  .msg.info { background: #fff6e0; color: #8a5a00; }
  .status { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #e6f0ff; color: #1f6feb; font-size: 14px; font-weight: 600; }
  textarea { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #c9d0d8; border-radius: 8px; font-family: inherit; }
  label.consent { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; margin-top: 12px; line-height: 1.4; }
  label.consent input { margin-top: 3px; width: 20px; height: 20px; flex: none; }
  a { color: #1f6feb; }
  .muted { color: #667; font-size: 13px; }
</style>
</head>
<body>
<header>일잡코리아 일감 안내</header>
<main id="app"><div class="card">불러오는 중...</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="w.js"></script>
</body>
</html>
