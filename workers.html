<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>일잡코리아 인력배치 - 구직자</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<header class="top"><h1>구직자 관리</h1><nav id="nav"></nav></header>
<main>
  <div class="toolbar">
    <input type="search" id="q" placeholder="이름·전화번호 검색">
    <select id="view"></select>
    <button id="xlsx">엑셀 내려받기</button>
    <button id="print">인쇄 / PDF</button>
    <button class="primary" id="add">+ 구직자 등록</button>
  </div>
  <div class="card">
    <div class="scroll">
      <table class="has-act">
        <thead><tr><th>이름</th><th>전화</th><th>직종</th><th>가능 지역</th><th>가능 요일</th><th>상태</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="muted" id="empty"></div>
  </div>
</main>

<dialog id="dlg">
  <form id="f">
    <h2 id="dlgTitle">구직자 등록</h2>
    <div id="branchRow" hidden>
      <label class="f" for="branch">지점</label>
      <select id="branch"></select>
    </div>
    <label class="f" for="name">이름 *</label>
    <input type="text" id="name" required maxlength="40">
    <label class="f" for="phone">휴대폰 번호 *</label>
    <input type="tel" id="phone" required placeholder="010-0000-0000">
    <label class="f">직종 (해당되는 것 모두 선택)</label>
    <div class="checks" id="jobs"></div>
    <label class="f" for="area">가능 지역</label>
    <input type="text" id="area" maxlength="100" placeholder="예: 원주, 횡성">
    <label class="f">가능 요일</label>
    <div class="checks" id="days"></div>
    <label class="f" for="memo">메모</label>
    <textarea id="memo" rows="2" maxlength="500"></textarea>
    <div id="trainBox" hidden>
      <label class="f">사무소 자체교육</label>
      <div class="checks">
        <label><input type="checkbox" id="trainDone"> 이수함</label>
        <input type="date" id="trainDate" style="width:160px">
      </div>
      <div class="muted">이수한 날짜를 입력해 주세요. 체크·변경 기록이 남습니다.</div>
    </div>
    <label class="f">계좌 정보 (일당 지급용)</label>
    <div class="muted" id="bankHint"></div>
    <div class="checks">
      <input type="text" id="bankName" list="banks" placeholder="은행 (예: 농협)" maxlength="20" style="width:130px">
      <input type="text" id="bankNo" inputmode="numeric" placeholder="계좌번호 (숫자만)" maxlength="30" style="width:190px">
      <input type="text" id="bankHolder" placeholder="예금주" maxlength="20" style="width:110px">
    </div>
    <datalist id="banks">
      <option value="농협"></option><option value="국민"></option><option value="신한"></option><option value="우리"></option>
      <option value="하나"></option><option value="기업"></option><option value="카카오뱅크"></option><option value="토스뱅크"></option>
      <option value="케이뱅크"></option><option value="새마을금고"></option><option value="우체국"></option><option value="수협"></option>
      <option value="SC제일"></option><option value="씨티"></option><option value="부산"></option><option value="대구"></option>
      <option value="광주"></option><option value="전북"></option><option value="경남"></option><option value="제주"></option>
    </datalist>
    <label class="f">신분증 사본</label>
    <div id="idStatus" class="acts" style="align-items:center"></div>
    <input type="file" id="idFile" accept="image/jpeg,image/png,image/webp,application/pdf">
    <div id="qualBox" hidden>
    <label class="f">요양보호사 자격증 사본</label>
    <div id="qualStatus" class="acts" style="align-items:center"></div>
    <input type="file" id="qualFile" accept="image/jpeg,image/png,image/webp,application/pdf">
    </div>
    <div id="shareLog" class="muted" style="margin-top:6px"></div>
    <label class="f">통장 사본</label>
    <div id="bookStatus" class="acts" style="align-items:center"></div>
    <input type="file" id="bookFile" accept="image/jpeg,image/png,image/webp,application/pdf">
    <div class="muted" style="margin-top:6px">신분증은 <b>주민등록번호 뒷자리를 가린 사본</b>을 올려 주세요. 파일은 비공개 저장소에 보관되고, 보기·교체·삭제는 관리자만 할 수 있으며 열람 기록이 남습니다. (10MB 이하, 사진 또는 PDF)</div>
    <label class="f"><span class="checks"><label><input type="checkbox" id="consent"> 개인정보 수집·이용 동의를 받았음 (신분증·계좌 포함)</label></span></label>
    <label class="f"><span class="checks"><label><input type="checkbox" id="shareConsent"> 신분증·자격증 등 정보를 의뢰처(요양원·요양병원 등)에 제공하는 것에 동의를 받았음</label></span></label>
    <div class="msg" id="err"></div>
    <div class="formbtns">
      <button type="button" id="cancel">취소</button>
      <button type="submit" class="primary" id="save">저장</button>
    </div>
  </form>
</dialog>

<dialog id="sdlg" style="width:min(460px,94vw)">
  <h2 id="sTitle">서류 사본 제공</h2>
  <div class="muted">제공 기록을 남기고 파일을 내려받습니다. 받는 곳에 보낸 뒤에는 내려받은 파일을 컴퓨터에서 지워 주세요.</div>
  <label class="f" for="shareClient">받는 곳 (의뢰인 목록에서 선택)</label>
  <select id="shareClient"></select>
  <label class="f" for="shareName">목록에 없으면 직접 입력 (요양원·요양병원 이름)</label>
  <input type="text" id="shareName" maxlength="60">
  <label class="f" for="shareMethod">보내는 방법</label>
  <select id="shareMethod">
    <option value="kakao">카카오톡</option>
    <option value="email">이메일</option>
    <option value="fax">팩스</option>
    <option value="print">출력해서 직접 전달</option>
    <option value="other">기타</option>
  </select>
  <label class="f" for="shareMemo">메모 (요청 내용 등)</label>
  <input type="text" id="shareMemo" maxlength="200">
  <div class="msg" id="shareErr"></div>
  <div class="formbtns">
    <button type="button" id="shareCancel">취소</button>
    <button type="button" class="primary" id="shareOk">기록하고 내려받기</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="common.js"></script>
<script src="workers.js"></script>
</body>
</html>
